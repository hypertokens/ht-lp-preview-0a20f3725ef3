<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Hyper Tokens Ads</title>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Inter;src:url(fonts/inter.woff2) format("woff2");font-weight:100 900;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0D12;--bd:#1F2430;--bd2:#2A3040;--tx:#EDEEF2;--mu:#A0A7B8;--mu2:#7D8496;--mint:#2ED3A0;--red:#FF4D6A;--hl:#50D2C1}
html,body{height:100%;background:var(--bg);color:var(--tx);font:500 15px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:center;padding:14px 20px 6px;border-bottom:1px solid var(--bd)}
.logo{font:900 18px/1 Inter;letter-spacing:-.02em}
.logo span{color:var(--hl)}
main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:12px 20px 8px;min-height:0}
.pair{display:flex;gap:clamp(16px,3vw,36px);align-items:flex-end;justify-content:center;width:100%;max-width:1400px}
.unit{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.unit .lab{font:800 12px/1 'Inter',system-ui;letter-spacing:.14em;text-transform:uppercase}
.unit .lab.ivol{color:var(--mint)}.unit .lab.vol{color:var(--red)}
.frame{display:flex;flex-direction:column;align-items:center;gap:10px}
img.ad{
  display:block;
  width:auto;
  height:min(88vh, 820px);
  max-height:88vh;
  max-width:calc((100vw - 80px) / 2);
  aspect-ratio:300 / 600;
  object-fit:contain;
  border:1px solid var(--bd2);
  border-radius:6px;
  background:#000;
}
.replay{
  appearance:none;border:1px solid var(--bd2);background:#0a0c10;color:var(--tx);
  font:700 11px Inter,system-ui;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 14px;border-radius:999px;cursor:pointer
}
.replay:hover{border-color:var(--hl);color:var(--hl)}
footer{flex:0 0 auto;padding:10px 20px 16px;text-align:center;border-top:1px solid var(--bd)}
footer .risk{color:var(--mu2);font-size:12px;max-width:64ch;margin:0 auto;line-height:1.45}
@media (max-width:720px){
  main{padding:10px}
  .pair{flex-direction:column;align-items:center;gap:18px}
  img.ad{height:min(70vh, 640px);max-width:92vw}
}
</style>
</head>
<body>
<header><div class="logo">HYPER <span>TOKENS</span></div></header>
<main>
  <div class="pair">
    <div class="unit">
      <div class="lab ivol">iVOL</div>
      <div class="frame">
        <img class="ad" src="ads/3x/300x600/r19-i5.gif?v=5" width="300" height="600" data-replay="ivol" alt="iVOL — Perps suck. Get ~6x long BTC.">
        <button type="button" class="replay" data-replay-btn="ivol">↻ Replay</button>
      </div>
    </div>
    <div class="unit">
      <div class="lab vol">VOL</div>
      <div class="frame">
        <img class="ad" src="ads/3x/300x600/r19-v5.gif?v=5" width="300" height="600" data-replay="vol" alt="VOL — Perps suck. Get ~6x short BTC.">
        <button type="button" class="replay" data-replay-btn="vol">↻ Replay</button>
      </div>
    </div>
  </div>
</main>
<footer>
  <p class="risk">Leveraged tokens can lose most or all of their value; no return is guaranteed.</p>
</footer>
<script>
function replayGif(id){
  document.querySelectorAll('img[data-replay="'+id+'"]').forEach(function(img){
    var base=img.getAttribute('data-src')||img.getAttribute('src').split('?')[0];
    img.setAttribute('data-src', base);
    img.src=base+'?r='+Date.now().toString(36);
  });
}
document.querySelectorAll('[data-replay-btn]').forEach(function(btn){
  btn.addEventListener('click', function(){ replayGif(btn.getAttribute('data-replay-btn')); });
});
</script>
</body>
</html>
